spring:
  application.name: driver-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/driver_service
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          ratings:
            url: http://localhost:8083/api/v1/ratings
            connect-timeout: 3000
            read-timeout: 5000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: group-1
      properties:
        spring.json:
          trusted.packages: '*'
          type.mapping: ChangeDriverStatusEvent:com.tserashkevich.driverservice.kafka.kafkaDtos.ChangeDriverStatusEvent
      change-driver-status-topic:
        name: change-driver-status-topic
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/taxi-aggregator
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/taxi-aggregator
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: passenger-service
            client-secret: mLpVyia4h1OPejq0ZDAHSdDpQDVc8Let
            scope: openid

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1
    enabled: true

resilience4j:
  retry:
    instances:
      ratings-retry:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      ratings-breaker:
        sliding-window-type: count_based
        sliding-window-size: 5
        failure-rate-threshold: 75
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 20s
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 2

server:
  port: 8080