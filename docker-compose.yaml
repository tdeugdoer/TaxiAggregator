services:
  postgredb:
    image: postgres:latest
    container_name: postgredb
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PG_DATA=/var/lib/postgresql/data
    volumes:
      - ./volumes/postgresql/data:/var/lib/postgresql/data
      - ./volumes/postgresql/postgresql.conf:/etc/postgres/sql/postgresql.conf
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27018:27017"
    volumes:
      - ./volumes/mongo-data:/data/db
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  cassandradb:
    image: cassandra:latest
    container_name: cassandradb
    ports:
      - "9042:9042"
    volumes:
      - ./volumes/cassandra:/var/lib/cassandra
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2700M

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=PVjHlx7ESeesq55jeB6Efw
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9091
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - ./volumes/kafka/temp/server-1/:/bitnami/kafka
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: [ "--kafka.server=kafka:9092" ]
    restart: unless-stopped
    ports:
      - '9308:9308'
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: elasticsearch
    ports:
      - '9200:9200'
    environment:
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  logstash:
    image: logstash:8.15.3
    container_name: logstash
    volumes:
      - ./monitoring/logstash:/usr/share/logstash/pipeline:ro
    ports:
      - '5001:5001'
    links:
      - elasticsearch
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 512M

  kibana:
    image: kibana:8.15.3
    container_name: kibana
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    links:
      - elasticsearch
    depends_on:
      - logstash
    deploy:
      resources:
        limits:
          memory: 1g

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - TZ=Europe/Moscow
    volumes:
      - ./volumes/keycloak/themes:/opt/keycloak/themes/custom/login
    command:
      - start-dev
    ports:
      - "8085:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g

  rating-service:
    image: rating-service:latest
    container_name: rating-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8083:8083"
    depends_on:
      - cassandradb
      - kafka
      - keycloak
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M

  passenger-service:
    image: passenger-service:latest
    container_name: passenger-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8081:8081"
    depends_on:
      - postgredb
      - kafka
      - keycloak
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.9"
          memory: 500M

  driver-service:
    image: driver-service:latest
    container_name: driver-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    depends_on:
      - postgredb
      - kafka
      - keycloak
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M

  ride-service:
    image: ride-service:latest
    container_name: ride-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
      - kafka
      - keycloak
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M