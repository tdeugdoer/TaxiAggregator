spring:
  application.name: rating-service
  cassandra:
    contact-points: cassandradb
    port: 9042
    keyspace-name: mykeyspace
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        spring.json:
          trusted.packages: '*'
          type.mapping: RatingCreateEvent:com.tserashkevich.ratingservice.kafka.kafkaDtos.RatingCreateEvent
      group-id: group-1
      create-rating-topic:
        name: create-rating-topic
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/taxi-aggregator
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/taxi-aggregator
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: passenger-service
            client-secret: mLpVyia4h1OPejq0ZDAHSdDpQDVc8Let
            scope: openid

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1
    enabled: true

server:
  port: 8083