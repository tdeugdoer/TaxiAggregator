services:
  prometheus-k8s:
    image: prom/prometheus:latest
    container_name: prometheus-k8s
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ../monitoring/prometheus/prometheus-k8s.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  grafana-k8s:
    image: grafana/grafana:latest
    container_name: grafana-k8s
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus-k8s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

  elasticsearch-k8s:
    image: elasticsearch:8.15.3
    container_name: elasticsearch-k8s
    ports:
      - '9200:9200'
    environment:
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  logstash-k8s:
    image: logstash:8.15.3
    container_name: logstash-k8s
    volumes:
      - ../monitoring/logstash:/usr/share/logstash/pipeline:ro
    ports:
      - '5001:5001'
    links:
      - elasticsearch-k8s
    depends_on:
      - elasticsearch-k8s
    deploy:
      resources:
        limits:
          memory: 512M

  kibana-k8s:
    image: kibana:8.15.3
    container_name: kibana-k8s
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    links:
      - elasticsearch-k8s
    depends_on:
      - logstash-k8s
    deploy:
      resources:
        limits:
          memory: 1g