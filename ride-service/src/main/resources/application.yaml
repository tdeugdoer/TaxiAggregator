spring:
  application.name: ride-service
  data:
    mongodb:
      uri: mongodb://localhost/27017
      database: local
  cloud:
    openfeign:
      client:
        config:
          geoapify:
            url: https://api.geoapify.com/v1
            connect-timeout: 3000
            read-timeout: 5000
          driver:
            url: http://localhost:8080/api/v1/drivers
            connect-timeout: 3000
            read-timeout: 5000
          car:
            url: http://localhost:8080/api/v1/cars
            connect-timeout: 3000
            read-timeout: 5000
          passenger:
            url: http://localhost:8081/api/v1/passengers
            connect-timeout: 3000
            read-timeout: 5000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: RatingCreateEvent:com.tserashkevich.rideservice.kafka.kafkaDtos.RatingCreateEvent, ChangeDriverStatusEvent:com.tserashkevich.rideservice.kafka.kafkaDtos.ChangeDriverStatusEvent
      create-rating-topic:
        name: create-rating-topic
      change-driver-status-topic:
        name: change-driver-status-topic
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/taxi-aggregator
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/taxi-aggregator
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: passenger-service
            client-secret: mLpVyia4h1OPejq0ZDAHSdDpQDVc8Let
            scope: openid

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1
    enabled: true

resilience4j:
  retry:
    instances:
      retry-conf:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      circuitbreaker-conf:
        sliding-window-type: count_based
        sliding-window-size: 5
        failure-rate-threshold: 75
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 20s
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 2

geoapify:
  apiKey: ea1ca0da5eae49128b9e311d225b61ac

server:
  port: 8082